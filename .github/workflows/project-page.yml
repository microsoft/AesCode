name: Deploy AesCode project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/project-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aescode-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify unchanged original video
        shell: bash
        run: |
          echo 'c5c54f287d8e58a82727280d83f177005404b5e2a0633afa6733f4db834e1cdc  site/media/film.mp4' | sha256sum --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
